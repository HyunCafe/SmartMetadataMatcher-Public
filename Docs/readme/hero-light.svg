ter-spacing="0">Imported titles</text><text x="781" y="127" fill="#52446b" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="0">PC and emulator libraries</text><rect x="706" y="169" width="350" height="84" rx="15" fill="#fdfbff" stroke="#cbb9ea"/><rect x="724" y="189" width="40" height="40" rx="10" fill="#eee8ff" stroke="none"/><text x="732" y="215" fill="#6238a0" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0">02</text><text x="781" y="204" fill="#21143d" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="0">Compare IGDB records</text><text x="781" y="230" fill="#52446b" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="0">Platform, edition, and rivals</text><rect x="706" y="272" width="350" height="84" rx="15" fill="#fdfbff" stroke="#cbb9ea"/><rect x="724" y="292" width="40" height="40" rx="10" fill="#eee8ff" stroke="none"/><text x="732" y="318" fill="#6238a0" font-family="monospace" font-size="16" font-weight="700" letter-spacing="0">03</text><text x="781" y="307" fill="#21143d" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="0">Approve eligible matches</text><text x="781" y="333" fill="#52446b" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="0">One batch review</text></g></svg>
