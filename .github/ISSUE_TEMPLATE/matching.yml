name: Matching problem
description: Report a wrong identity or a match that needs review.
body:
  - type: markdown
    attributes:
      value: "Do not upload credentials, full library exports, databases, recovery journals or private paths. Report security issues through SECURITY.md."
  - type: textarea
    id: title
    attributes:
      label: Game title
      description: Provide the relevant title only; omit filenames containing private paths.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Exact platform as shown in Playnite.
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: Expected and selected identities
      description: IGDB links or IDs, edition/region evidence and competing candidates where known.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed behavior
      description: Automatic eligibility, Needs review, Unmatched, and what you expected.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and reproduction
      description: Playnite version, extension version or source commit, fresh/cached scan, and steps to reproduce.
    validations:
      required: true
